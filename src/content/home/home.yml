approach:
  eyebrow: Engineering approach
  title: Conservative decisions for systems that have to keep working.
  description: The recurring themes behind my backend and business-systems work.
  items:
    - title: Business logic clarity
      body: >-
        Model operational rules explicitly so backend behavior remains understandable as
        requirements evolve.
    - title: Relational data integrity
      body: >-
        Design data relationships around the business, with attention to historical correctness
        and reporting needs.
    - title: Historical correctness
      body: >-
        Preserve the facts that were true at the time of a transaction instead of rewriting
        history with current values.
    - title: Reporting separation
      body: >-
        Keep operational writes focused while shaping complex reads for dashboards, reports, and
        exports.
    - title: Production pragmatism
      body: >-
        Prefer conservative, maintainable decisions that support debugging, change, and day-to-day
        software delivery.
    - title: System integration
      body: >-
        Treat external hardware and operational dependencies as clear boundaries with explicit
        mapping and persistence.

