<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="system-context-title system-context-description">
  <title id="system-context-title">Gymbo high-level system context</title>
  <desc id="system-context-description">An architecture illustration showing authorized users entering a web interface, which connects to application and business rules. The application stores operational records in a relational database, reads reporting views for dashboards and PDF or Excel export, and exchanges attendance data with Dahua biometric devices through a dedicated integration service layer. Exact technologies and deployment boundaries are intentionally not shown.</desc>
  <defs>
    <linearGradient id="surface" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#0c202d"/>
      <stop offset="1" stop-color="#081721"/>
    </linearGradient>
    <linearGradient id="accent-surface" x1="0" x2="1">
      <stop offset="0" stop-color="#11333d"/>
      <stop offset="1" stop-color="#0d2832"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-30%" width="140%" height="160%">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#020a0f" flood-opacity=".42"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#5ce1d8"/>
    </marker>
    <style>
      .eyebrow { fill: #79eee5; font: 700 14px ui-monospace, "Cascadia Code", monospace; letter-spacing: 2.4px; }
      .title { fill: #f2fbfc; font: 700 29px system-ui, -apple-system, "Segoe UI", sans-serif; }
      .label { fill: #eef9fb; font: 650 20px system-ui, -apple-system, "Segoe UI", sans-serif; }
      .copy { fill: #aac1ca; font: 400 15px system-ui, -apple-system, "Segoe UI", sans-serif; }
      .micro { fill: #8ca8b2; font: 500 13px system-ui, -apple-system, "Segoe UI", sans-serif; }
      .flow { fill: none; stroke: #5ce1d8; stroke-width: 2.5; marker-end: url(#arrow); }
      .flow-muted { fill: none; stroke: #5f8490; stroke-width: 2; marker-end: url(#arrow); }
      .node { fill: url(#surface); stroke: #31505d; stroke-width: 1.5; }
      .node-accent { fill: url(#accent-surface); stroke: #4ab9b6; stroke-width: 1.5; }
    </style>
  </defs>

  <rect width="1200" height="760" rx="28" fill="#07141d"/>
  <path d="M0 150H1200M0 380H1200M0 610H1200" stroke="#18313c" stroke-width="1" opacity=".38"/>
  <path d="M230 0V760M600 0V760M970 0V760" stroke="#18313c" stroke-width="1" opacity=".28"/>

  <text x="64" y="68" class="eyebrow">DOCUMENTED SYSTEM CONTEXT</text>
  <text x="64" y="108" class="title">Gymbo’s documented high-level boundaries</text>
  <text x="1136" y="70" class="micro" text-anchor="end">Technology and deployment details intentionally omitted</text>

  <g filter="url(#shadow)">
    <rect x="64" y="178" width="218" height="132" rx="18" class="node"/>
    <circle cx="108" cy="223" r="18" fill="#173945" stroke="#5ce1d8"/>
    <path d="M100 223h16M108 215v16" stroke="#bdfbf6" stroke-width="2" stroke-linecap="round"/>
    <text x="140" y="220" class="label">Authorized users</text>
    <text x="88" y="266" class="copy">Manage gym operations</text>
    <text x="88" y="289" class="copy">through the web interface</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="362" y="160" width="314" height="168" rx="20" class="node-accent"/>
    <text x="390" y="202" class="eyebrow">WEB APPLICATION</text>
    <text x="390" y="239" class="label">Interface + business rules</text>
    <text x="390" y="273" class="copy">Subscribers · memberships · pricing</text>
    <text x="390" y="298" class="copy">Finance · lockers · trainers · reports</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="758" y="174" width="378" height="140" rx="18" class="node"/>
    <text x="786" y="215" class="eyebrow">HARDWARE BOUNDARY</text>
    <text x="786" y="251" class="label">Dahua attendance devices</text>
    <text x="786" y="282" class="copy">Attendance logs are polled and mapped</text>
  </g>

  <path d="M282 244H350" class="flow"/>
  <text x="316" y="230" class="micro" text-anchor="middle">uses</text>
  <path d="M758 244H716V470H688" class="flow"/>
  <text x="733" y="359" class="micro" text-anchor="middle">logs</text>

  <g filter="url(#shadow)">
    <rect x="362" y="412" width="314" height="116" rx="18" class="node"/>
    <text x="390" y="452" class="eyebrow">INTEGRATION SERVICE LAYER</text>
    <text x="390" y="488" class="label">Identity mapping + persistence</text>
  </g>
  <path d="M519 412V340" class="flow"/>

  <g filter="url(#shadow)">
    <rect x="64" y="598" width="328" height="104" rx="18" class="node"/>
    <text x="92" y="638" class="eyebrow">OPERATIONAL STATE</text>
    <text x="92" y="674" class="label">Relational database</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="436" y="598" width="300" height="104" rx="18" class="node"/>
    <text x="464" y="638" class="eyebrow">REPORTING PROJECTIONS</text>
    <text x="464" y="674" class="label">Database views</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="780" y="584" width="356" height="132" rx="18" class="node-accent"/>
    <text x="808" y="626" class="eyebrow">READABLE OUTPUT</text>
    <text x="808" y="662" class="label">Dashboards and reports</text>
    <text x="808" y="691" class="copy">Optional PDF / Excel export</text>
  </g>

  <path d="M430 528L268 587" class="flow"/>
  <text x="331" y="555" class="micro" transform="rotate(-20 331 555)">attendance records</text>
  <path d="M392 650H424" class="flow-muted"/>
  <path d="M736 650H768" class="flow"/>

  <text x="64" y="740" class="micro">Architecture illustration — not a deployment topology or detailed data model</text>
</svg>
